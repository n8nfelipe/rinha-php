; Configuração de produção para a Rinha.
; O foco é manter tudo aquecido e evitar I/O/estatística de arquivos.

memory_limit = 256M
max_execution_time = 0
display_errors = 0
display_startup_errors = 0
log_errors = 1
error_log = /proc/self/fd/2
expose_php = 0

; OPcache: código imutável dentro da imagem, então não validamos timestamps.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 0
opcache.fast_shutdown = 1

; JIT tracing: o loop do worker e o parse/validação em PHP são quentes.
opcache.jit = tracing
opcache.jit_buffer_size = 128M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

zend.exception_ignore_args = 1
zend.assertions = -1

default_charset = "UTF-8"
date.timezone = UTC
