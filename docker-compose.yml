name: rinha-php85

# Arquivo de entrega da Rinha.
#
# Regras atendidas aqui:
#  - 2 instâncias da API (api1, api2) atrás do load balancer (nginx) na 9999;
#  - banco Postgres;
#  - soma dos limites: 1.5 CPU e 2.71 GB (máximo permitido: 1.5 CPU / 3 GB);
#  - imagens públicas, sem "build:" (a Rinha não constrói imagens).
#
# Para construir a imagem localmente use o override docker-compose.build.yml.
# A imagem precisa ser publicada (Docker Hub/GHCR) e referenciada em
# RINHA_API_IMAGE para a submissão.

x-api: &api
  image: ${RINHA_API_IMAGE:-rinha-php85:latest}
  restart: unless-stopped
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: rinha
    DB_USER: rinha
    DB_PASS: rinha
    PHP_WORKERS: "8"
  depends_on:
    db:
      condition: service_healthy
  expose:
    - "80"
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/contagem-pessoas"]
    interval: 30s
    timeout: 5s
    retries: 10
    start_period: 10s
  deploy:
    resources:
      limits:
        cpus: "0.21"
        memory: "320M"

services:
  api1:
    <<: *api
    hostname: api1

  api2:
    <<: *api
    hostname: api2

  # Consome a marca d'água e alimenta o índice GIN de pessoas_busca em lote.
  # Sem ele a busca continua respondendo, mas para de ver registros novos: a
  # janela lida direto de `pessoas` é limitada a 1000 linhas.
  indexer:
    image: ${RINHA_API_IMAGE:-rinha-php85:latest}
    hostname: indexer
    restart: unless-stopped
    command: ["php", "/app/src/indexer.php"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: rinha
      DB_USER: rinha
      DB_PASS: rinha
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.04"
          memory: "96M"

  nginx:
    image: nginx:1.29-alpine
    hostname: nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "96M"

  db:
    image: postgres:17-alpine
    hostname: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha
      POSTGRES_DB: rinha
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      # Commit assíncrono: o WAL é gravado no disco em poucos ms, mas o POST
      # não espera o fsync. A regra exige persistência *eventual* em disco.
      - -c
      - synchronous_commit=off
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=512MB
      - -c
      - wal_buffers=32MB
      - -c
      - wal_writer_delay=10ms
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinha -d rinha"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.89"
          memory: "1.9GB"

volumes:
  pgdata:
